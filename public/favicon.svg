<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .badge-shadow {
        fill: #FFE500;
      }
      .badge-bg {
        fill: #000000;
        stroke: #000000;
        stroke-width: 2;
      }
      .badge-outline {
        stroke: #FFE500;
        stroke-width: 1.5;
        stroke-opacity: 0.35;
        fill: none;
      }
      .badge-text {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 27px;
        fill: #FFE500;
        letter-spacing: -0.04em;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
  </defs>

  <!-- Neo-brutalist offset shadow -->
  <rect x="7" y="10" width="52" height="46" class="badge-shadow" rx="0" />
  <rect x="7" y="10" width="52" height="46" fill="none" stroke="#000000" stroke-width="2" rx="0" />

  <!-- Main Navbar Black Badge -->
  <rect x="4" y="7" width="52" height="46" class="badge-bg" rx="0" />

  <!-- Crisp inner contrast border for dark browser tabs -->
  <rect x="6" y="9" width="48" height="42" class="badge-outline" rx="0" />

  <!-- Logo Text: MN. -->
  <text x="30" y="30" class="badge-text">MN.</text>
</svg>