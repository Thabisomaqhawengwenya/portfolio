<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0D0D0D"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222222" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Neo-Brutalist Frame Border -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <rect x="38" y="38" width="1140" height="570" fill="none" stroke="#FFE500" stroke-width="2" opacity="0.5"/>

  <!-- Top Status Badge -->
  <rect x="70" y="70" width="280" height="42" fill="#FFE500" stroke="#000000" stroke-width="2"/>
  <circle cx="92" cy="91" r="6" fill="#00C853"/>
  <text x="110" y="97" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#000000" letter-spacing="1">AVAILABLE FOR HIRE</text>

  <!-- Main Name & Title -->
  <text x="70" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
    Maqhawe <tspan fill="#FFE500">Ngwenya.</tspan>
  </text>
  
  <text x="70" y="275" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="700" fill="#D0D0D0" letter-spacing="-1">
    Junior Full-Stack Software Developer
  </text>

  <text x="70" y="335" font-family="'Courier New', monospace" font-size="20" fill="#A0A0A0" letter-spacing="0">
    Building modern, high-performance web applications with React, TypeScript &amp; Node.js
  </text>

  <!-- Skill Badges -->
  <g transform="translate(70, 390)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="120" height="44" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="60" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFE500" text-anchor="middle">React</text>

    <!-- Badge 2 -->
    <rect x="135" y="0" width="160" height="44" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="215" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00E5FF" text-anchor="middle">TypeScript</text>

    <!-- Badge 3 -->
    <rect x="310" y="0" width="140" height="44" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="380" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#00E676" text-anchor="middle">Node.js</text>

    <!-- Badge 4 -->
    <rect x="465" y="0" width="160" height="44" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="545" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FF334B" text-anchor="middle">PostgreSQL</text>

    <!-- Badge 5 -->
    <rect x="640" y="0" width="140" height="44" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="2"/>
    <text x="710" y="28" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#FFE500" text-anchor="middle">Firebase</text>
  </g>

  <!-- Bottom Footer Info -->
  <line x1="70" y1="490" x2="1130" y2="490" stroke="#333333" stroke-width="2"/>
  
  <text x="70" y="540" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#FFFFFF">
    📍 Zimbabwe  •  🌐 Portfolio &amp; Engineering CMS
  </text>

  <text x="1130" y="540" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#FFE500" text-anchor="end">
    github.com/Thabisomaqhawengwenya
  </text>
</svg>
